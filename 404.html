<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found - The Lean Sculpt Lab</title>
  <meta name="robots" content="noindex">
  <script>
    (function () {
      var p = location.pathname;
      if (p.length > 1 && /\/$/.test(p)) {
        p = p.replace(/\/+$/, "").replace(/monitoring-your-transformatiom$/, "monitoring-your-transformation");
        location.replace(p + location.search + location.hash);
      }
    })();
  </script>
  <link rel="icon" href="https://media.cwd-cdn.com/the-lean-sculpt-lab/images/favicon.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap">
  <style>
    :root { --peach: #eabb92; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 24px;
      font: 300 17px/1.7 "Montserrat", Helvetica, Arial, sans-serif;
      text-align: center;
      color: #fff;
      background: #000;
    }
    main { width: 100%; max-width: 560px; }
    .logo img { display: block; width: 150px; height: auto; margin: 0 auto; }
    .rule { width: 64px; height: 3px; margin: 32px auto; background: var(--peach); border: 0; }
    .code { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.3em; color: var(--peach); }
    h1 { margin: 8px 0 12px; font-size: clamp(30px, 6vw, 40px); font-weight: 300; line-height: 1.2; }
    p { margin: 0; color: rgba(255, 255, 255, 0.8); }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      margin-top: 32px;
      padding: 12px 28px;
      font: 600 13px/1.3 "Montserrat", Helvetica, Arial, sans-serif;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      text-decoration: none;
      color: #000;
      background: var(--peach);
      border: 1px solid var(--peach);
      border-radius: 999px;
      transition: background-color 0.2s, color 0.2s, transform 0.2s;
    }
    .btn:hover, .btn:focus-visible { color: #000; background: #fff; border-color: #fff; transform: translateY(-1px); }
    .btn:focus-visible, .links a:focus-visible { outline: 2px solid var(--peach); outline-offset: 3px; }
    .links-title { margin-top: 40px; font-size: 12px; font-weight: 500; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(255, 255, 255, 0.6); }
    .links { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin: 16px 0 0; padding: 0; list-style: none; }
    .links a {
      display: inline-block;
      padding: 10px 22px;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--peach);
      border: 2px solid var(--peach);
      border-radius: 999px;
      transition: background-color 0.2s, color 0.2s;
    }
    .links a:hover, .links a:focus-visible { color: #000; background: var(--peach); }
    .call { margin-top: 40px; font-size: 15px; }
    .call a { color: var(--peach); font-weight: 500; white-space: nowrap; text-decoration: none; }
    .call a:hover { text-decoration: underline; }
    @media (max-width: 480px) {
      .btn, .links a { width: 100%; }
      .links li { width: 100%; }
    }
  </style>
</head>
<body>
  <main>
    <a class="logo" href="https://theleansculptlab.ca/" data-path="" aria-label="The Lean Sculpt Lab home">
      <img src="https://media.cwd-cdn.com/the-lean-sculpt-lab/images/logo-white.png" alt="The Lean Sculpt Lab" width="304" height="195">
    </a>
    <hr class="rule">
    <p class="code">404</p>
    <h1>Page not found</h1>
    <p>Sorry, the page you're looking for has moved or no longer exists.</p>
    <a class="btn" href="https://theleansculptlab.ca/" data-path="">Back to Home</a>
    <p class="links-title">Popular pages</p>
    <ul class="links">
      <li><a href="https://theleansculptlab.ca/emsculpt-neo" data-path="emsculpt-neo">EMSCULPT NEO</a></li>
      <li><a href="https://theleansculptlab.ca/diet-plan" data-path="diet-plan">Diet Plan</a></li>
      <li><a href="https://theleansculptlab.ca/request-a-free-consultation" data-path="request-a-free-consultation">Request a Free Consultation</a></li>
    </ul>
    <p class="call">Questions? Call <a href="tel:+17058882915">705-888-2915</a></p>
  </main>
  <script>
    (function () {
      var host = location.hostname;
      if (/(^|\.)theleansculptlab\.ca$/.test(host)) return;
      var base = "/";
      if (/\.github\.io$/.test(host)) base = "/" + location.pathname.split("/")[1] + "/";
      document.querySelectorAll("[data-path]").forEach(function (a) {
        a.href = base + a.getAttribute("data-path");
      });
    })();
  </script>
</body>
</html>
